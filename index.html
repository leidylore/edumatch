<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | EduMatch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="encabezado">
    <a class="marca" href="login.html"><span class="logo">EM</span>EduMatch</a>
  </header>

  <main class="contenedor">
    <section class="tarjeta">
      <h1>Iniciar sesión</h1>
      <p class="subtitulo">Valida tu cuenta para ver becas, cursos e intercambios recomendados para ti.</p>

      <form action="#" method="post">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="nombre@correo.com" autocomplete="email" required>

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>

        <button type="submit" class="boton">Iniciar sesión</button>
      </form>

      <p class="enlace-pie">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
    </section>
  </main>
</body>
</html>
