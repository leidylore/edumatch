<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error | EduMatch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="encabezado">
    <a class="marca" href="login.html"><span class="logo">EM</span>EduMatch</a>
  </header>

  <main class="contenedor">
    <section class="tarjeta centrado" role="alert">
      <div class="icono-alerta" aria-hidden="true">!</div>
      <h1 class="titulo-error">No pudimos completar tu solicitud</h1>
      <p class="subtitulo">Verifica tus datos e inténtalo nuevamente. Si el problema persiste, contacta al soporte de EduMatch.</p>
      <span class="codigo-error">Código de error: EM-500</span>

      <a href="javascript:history.back()" class="boton">Volver a intentar</a>
      <a href="login.html" class="boton boton-secundario">Regresar al inicio</a>
    </section>
  </main>
</body>
</html>
